<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Experiência de vídeo vertical em tela cheia.">
    <title>Vídeo em tela cheia</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="video-stage" aria-label="Vídeo em tela cheia">
      <video
        class="video video--background"
        aria-hidden="true"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        tabindex="-1"
      >
        <source src="./assets/video.mp4" type="video/mp4">
      </video>

      <video
        class="video video--primary"
        aria-label="Vídeo principal"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
      >
        <source src="./assets/video.mp4" type="video/mp4">
        Seu navegador não oferece suporte à reprodução de vídeo.
      </video>

      <button class="interaction-layer" type="button" aria-label="Ativar o som do vídeo"></button>
    </main>

    <script src="./js/main.js" defer></script>
  </body>
</html>
