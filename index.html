<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Experiência de vídeo vertical em tela cheia.">
    <title>Vídeo em tela cheia</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="video-stage" aria-label="Vídeo em tela cheia">
      <img
        class="video video--background"
        src="./assets/poster.jpg"
        alt=""
        aria-hidden="true"
      >

      <video
        class="video video--primary"
        aria-label="Vídeo principal"
        muted
        loop
        playsinline
        preload="auto"
        poster="./assets/poster.jpg"
        disablepictureinpicture
      >
        <source src="./assets/video.mp4" type="video/mp4">
        Seu navegador não oferece suporte à reprodução de vídeo.
      </video>

      <div class="seal-cue" aria-hidden="true">
        <span class="seal-cue__glow"></span>
        <span class="seal-cue__ring"></span>
        <span class="seal-cue__ring seal-cue__ring--delay"></span>
      </div>

      <p class="hint" aria-hidden="true">toque no lacre para abrir</p>

      <button class="interaction-layer" type="button" aria-label="Abrir o convite"></button>
    </main>

    <script src="./js/main.js" defer></script>
  </body>
</html>
