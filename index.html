<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Experiência de vídeo vertical em tela cheia.">
    <title>Vídeo em tela cheia</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="video-stage" aria-label="Vídeo em tela cheia">
      <iframe
        id="youtube-background"
        class="video-frame video-frame--background"
        aria-hidden="true"
        src="https://www.youtube.com/embed/zRSSl1pgFxU?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=zRSSl1pgFxU&amp;controls=0&amp;playsinline=1&amp;rel=0&amp;disablekb=1&amp;iv_load_policy=3"
        title=""
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"
      ></iframe>

      <iframe
        id="youtube-primary"
        class="video-frame video-frame--primary"
        src="https://www.youtube.com/embed/zRSSl1pgFxU?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=zRSSl1pgFxU&amp;controls=0&amp;playsinline=1&amp;rel=0&amp;disablekb=1&amp;iv_load_policy=3"
        title="27 de agosto de 2026"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"
      ></iframe>
    </main>
  </body>
</html>
