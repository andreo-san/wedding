<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Experiência de vídeo vertical em tela cheia.">
    <title>Vídeo em tela cheia</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="video-stage" aria-label="Vídeo em tela cheia">
      <iframe
        id="youtube-background"
        class="video video--background"
        aria-hidden="true"
        data-video-id="zRSSl1pgFxU"
        title=""
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"
      ></iframe>

      <iframe
        id="youtube-primary"
        class="video video--primary"
        data-video-id="zRSSl1pgFxU"
        title="27 de agosto de 2026"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"
      ></iframe>
    </main>

    <script src="./js/main.js" defer></script>
  </body>
</html>
